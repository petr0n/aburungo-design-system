name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  ci:
    name: Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the commit-message check compares against the base
          # branch, which a depth-1 clone does not have.
          fetch-depth: 0

      # Runs before install so it cannot be skipped by a dependency failure.
      # Needs only git + node, both present on the runner.
      - name: Brand check (forbidden mark)
        run: node scripts/check-forbidden-assets.mjs

      # The local commit-msg hook is not version-controlled, so a clone that
      # never ran install-hooks.sh has no protection. This is the backstop.
      - name: Commit message check (no AI attribution)
        run: |
          BASE="${{ github.event.pull_request.base.sha || 'HEAD~1' }}"
          node scripts/check-commit-msg.mjs --range "$BASE..HEAD"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # Touch targets are MEASURED in a browser, not inferred from class names
      # -- that is the whole reason the check found two defects grep could not.
      # So it needs Chrome, which `pnpm lint` must not: lint runs inside
      # `pnpm build`, and making a build depend on a browser download is a bad
      # trade. It gets its own step instead, which still fails the run.
      #
      # Not made skippable when Chrome is absent. A check that quietly passes
      # when it cannot run is the failure mode this repo already had once, when
      # check-contrast printed "pass" unconditionally and had never failed a
      # build.
      - name: Install headless Chrome
        run: npx puppeteer browsers install chrome-headless-shell

      - name: Touch targets and hover-only
        run: pnpm check:touch
