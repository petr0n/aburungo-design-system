      --radius-md: 0.5rem;
      --radius-lg: 0.75rem;
      --radius-xl: 1rem;
      --radius-2xl: 1.25rem;
      --radius-full: 9999px;
      --shadow-card: 0 1px 2px 0 rgb(21 9 24 / 0.05);
      --shadow-key: 0 1px 2px 0 rgb(21 9 24 / 0.04);
      --animate-card-enter: card-enter 0.28s cubic-bezier(0.16, 1, 0.3, 1) both;
      --animate-card-exit: card-exit  0.2s  ease-in                        both;
    }

    /* ─────────────────────────────────────────────────────────────────────────
       Reduced motion.  These animations are the only motion the package ships,
       and they fired unconditionally until now.

       This lives in tokens.css, not index.css, because the consuming app imports
       *this* file — `../aburungo/src/index.css` pulls in tokens.css and brand.css
       and never touches our index.css.  A guard there would never have reached
       the product, which is where FlipCard actually runs.

       Neutralised rather than shortened: a card sliding 36px is decoration, and
       someone who asked for less motion gets none of it.  Scoped to the two
       animation tokens rather than a blanket `* { animation: none }` so motion
       that carries meaning — a spinner, a progress fill — survives.
       ───────────────────────────────────────────────────────────────────────── */
    @media (prefers-reduced-motion: reduce) {
      :root {
        --animate-card-enter: none;
        --animate-card-exit: none;
      }
    }

    @keyframes card-enter {
      from { transform: translateY(-36px); opacity: 0; }
      to   { transform: translateY(0);     opacity: 1; }
    }

    @keyframes card-exit {
      from { transform: translateY(0);     opacity: 1; }
      to   { transform: translateY(44px);  opacity: 0; }
    }
    /* build-tokens:end */

  <style>html, body { margin: 0; min-height: 100vh; background: #f4f1f7; }</style>

<body>
  <div id="root"></div>

  <!-- Shared primitives (Button, PhraseCard, KanaGrid, etc) -->
  <script type="text/babel" src="mobile/components.jsx"></script>

  <!-- Design canvas host -->
  <script type="text/babel" src="design-canvas.jsx"></script>

  <!-- Desktop screen variants -->
  <script type="text/babel" src="desktop-screens.jsx"></script>

  <script type="text/babel">
    function App() {
      return (
        <DesignCanvas storageKey="aburungo-desktop-explore" background="#f4f1f7">
          <DCSection id="review" title="Review screen — desktop directions"
                     subtitle="Same components, three different desktop shapes. Drag to reorder, click to focus.">
            <DCArtboard id="centered" label="A · Centered narrow" width={1280} height={820}>
              <CenteredVariant/>
            </DCArtboard>
            <DCArtboard id="twopane" label="B · Two-pane app" width={1280} height={820}>
              <TwoPaneVariant/>
            </DCArtboard>
            <DCArtboard id="focus" label="C · Focused (big type + shortcuts)" width={1280} height={820}>
              <FocusVariant/>
            </DCArtboard>
          </DCSection>

          <DCSection id="landing" title="Landing — desktop"
                     subtitle="Two options for the marketing landing.">
            <DCArtboard id="landing-hero" label="Hero + side illustration" width={1280} height={820}>
              <LandingHeroVariant/>
            </DCArtboard>
            <DCArtboard id="landing-stacked" label="Stacked / centered" width={1280} height={820}>
              <LandingStackedVariant/>
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
