    /* ─────────────────────────────────────────────────────────────────────────
       Reduced motion.  These animations are the only motion the package ships,
       and they fired unconditionally until now.

       This lives in tokens.css, not index.css, because the consuming app imports
       *this* file — `../aburungo/src/index.css` pulls in tokens.css and brand.css
       and never touches our index.css.  A guard there would never have reached
       the product, which is where FlipCard actually runs.

       Neutralised rather than shortened: a card sliding 36px is decoration, and
       someone who asked for less motion gets none of it.  Scoped to the two
       animation tokens rather than a blanket `* { animation: none }` so motion
       that carries meaning — a spinner, a progress fill — survives.
       ───────────────────────────────────────────────────────────────────────── */
    @media (prefers-reduced-motion: reduce) {
      :root {
        --animate-card-enter: none;
        --animate-card-exit: none;
      }
    }

    @keyframes card-enter {
      from { transform: translateY(-36px); opacity: 0; }
      to   { transform: translateY(0);     opacity: 1; }
    }

    @keyframes card-exit {
      from { transform: translateY(0);     opacity: 1; }
      to   { transform: translateY(44px);  opacity: 0; }
    }

  <style>
    html, body {
      margin: 0;
      min-height: 100vh;
      background: var(--color-bg);
      font-family: "Noto Sans", system-ui, sans-serif;
      color: var(--color-fg);
    }
    .stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 36px;
      padding: 48px 24px 80px;
      min-height: 100vh;
    }
    .stage header.kit-head {
      text-align: center;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .kit-head h1 {
      margin: 0;
      font-size: 36px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .kit-head p { margin: 0; color: var(--color-fg-subtle); font-size: 16px; line-height: 1.55; }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .controls button {
      height: 36px; padding: 0 14px; border-radius: 9999px;
      font: 500 13px "Noto Sans", system-ui;
      background: var(--color-bg); color: var(--color-fg-muted); border: 1px solid var(--color-border);
      cursor: pointer;
    }
    .controls button[data-active="true"] { background: var(--color-fg); color: var(--color-bg); border-color: var(--color-fg); }
    /* Device-frame inner background is iOS gray by default; we want white. */
    .frame-shell { background: var(--color-bg) !important; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="screens.jsx"></script>

  <script type="text/babel">
    function App() {
      const [screen, setScreen] = React.useState('landing');

      const screens = [
        { id: 'landing', label: '1. Landing' },
        { id: 'signin',  label: '2. Sign in' },
        { id: 'review',  label: '3. Review' },
        { id: 'empty',   label: '4. All caught up' },
      ];

      let body = null;
      if (screen === 'landing')
        body = <LandingScreen onStart={() => setScreen('signin')}/>;
      else if (screen === 'signin')
        body = <SignInScreen onSubmit={() => setScreen('review')} onBack={() => setScreen('landing')}/>;
      else if (screen === 'review')
        body = <ReviewScreen onSignOut={() => setScreen('landing')} onComplete={() => setScreen('empty')}/>;
      else if (screen === 'empty')
        body = <EmptyScreen onSignOut={() => setScreen('landing')} onRestart={() => setScreen('review')}/>;

      return (
        <div className="stage">
          <header className="kit-head">
            <h1>AburunGo — Mobile UI kit</h1>
            <p>The actual product surface. Click through landing → sign in → review → all caught up. The review screen has three input modes; try the Kana grid.</p>
            <div className="controls">
              {screens.map((s) => (
                <button key={s.id} data-active={screen === s.id} onClick={() => setScreen(s.id)}>
                  {s.label}
                </button>
              ))}
            </div>
          </header>
          <div className="frame-shell" style={{ borderRadius: 48 }}>
            <IOSDevice width={402} height={874}>
              <div style={{ background: 'var(--color-bg)', minHeight: '100%' }}>
                {body}
              </div>
            </IOSDevice>
          </div>
        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App/>);
  </script>
</body>
