<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div class="label">Semantic foreground tokens</div>
  <div style="display:grid;grid-template-columns:auto 1fr auto;gap:8px 20px;align-items:center;font-size:14px">
    <span style="font-family:var(--font-mono);color:var(--fg-subtle);font-size:12px">--fg</span>
    <span style="color:var(--fg);font-weight:600">Primary text — body, headlines, buttons</span>
    <span class="hex" data-token="--fg" style="font-family:var(--font-mono);color:var(--fg-subtle);font-size:11px"></span>

    <span style="font-family:var(--font-mono);color:var(--fg-subtle);font-size:12px">--fg-muted</span>
    <span style="color:var(--fg-muted)">Labels, secondary copy, secondary button text</span>
    <span class="hex" data-token="--fg-muted" style="font-family:var(--font-mono);color:var(--fg-subtle);font-size:11px"></span>

    <span style="font-family:var(--font-mono);color:var(--fg-subtle);font-size:12px">--fg-subtle</span>
    <span style="color:var(--fg-subtle)">Meta, hints, authoring notes</span>
    <span class="hex" data-token="--fg-subtle" style="font-family:var(--font-mono);color:var(--fg-subtle);font-size:11px"></span>

    <span style="font-family:var(--font-mono);color:var(--fg-subtle);font-size:12px">--fg-faint</span>
    <span style="color:var(--fg-faint)">Placeholders, inactive states</span>
    <span class="hex" data-token="--fg-faint" style="font-family:var(--font-mono);color:var(--fg-subtle);font-size:11px"></span>

    <span style="font-family:var(--font-mono);color:var(--fg-subtle);font-size:12px">--brand-500</span>
    <span style="color:var(--brand-500);font-weight:600">The one accent — CTAs, focus rings, the mark</span>
    <span class="hex" data-token="--brand-500" style="font-family:var(--font-mono);color:var(--fg-subtle);font-size:11px"></span>
  </div>
</div>
<script src="_hex.js"></script>
</body></html>
