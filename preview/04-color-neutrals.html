<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div class="label">Neutrals — zinc. The whole UI runs on these.</div>
  <div class="row">
    <div class="swatch" style="flex:1"><div class="chip" style="background:var(--paper);border-color:var(--border)"></div><div class="name">0</div><div class="hex"></div></div>
    <div class="swatch" style="flex:1"><div class="chip" style="background:var(--surface)"></div><div class="name">50</div><div class="hex"></div></div>
    <div class="swatch" style="flex:1"><div class="chip" style="background:var(--surface-2)"></div><div class="name">100</div><div class="hex"></div></div>
    <div class="swatch" style="flex:1"><div class="chip" style="background:var(--border)"></div><div class="name">200</div><div class="hex"></div></div>
    <div class="swatch" style="flex:1"><div class="chip" style="background:var(--border-strong)"></div><div class="name">300</div><div class="hex"></div></div>
    <div class="swatch" style="flex:1"><div class="chip" style="background:var(--fg-faint)"></div><div class="name">400</div><div class="hex"></div></div>
    <div class="swatch" style="flex:1"><div class="chip" style="background:var(--fg-subtle)"></div><div class="name">500</div><div class="hex"></div></div>
    <div class="swatch" style="flex:1"><div class="chip" style="background:var(--fg-muted)"></div><div class="name">600</div><div class="hex"></div></div>
    <div class="swatch" style="flex:1"><div class="chip" style="background:var(--fg-muted)"></div><div class="name">700</div><div class="hex"></div></div>
    <div class="swatch" style="flex:1"><div class="chip" style="background:var(--fg)"></div><div class="name">900</div><div class="hex"></div></div>
  </div>
</div>
<script src="_hex.js"></script>
</body></html>
