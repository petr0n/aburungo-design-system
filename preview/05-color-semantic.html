<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div class="label">Semantic — appears only inside correctness banners</div>
  <div class="row">
    <div style="flex:1;display:flex;flex-direction:column;gap:8px">
      <div style="background:var(--success-bg);color:var(--success-fg);padding:14px 16px;border-radius:var(--radius-xl);text-align:center;font-weight:600">Recalled!</div>
      <div style="display:flex;gap:8px;font-family:var(--font-mono);font-size:11px;color:var(--fg-subtle)">
        <span>bg <span class="hex" data-token="--success-bg"></span></span>
        <span>fg <span class="hex" data-token="--success-fg"></span></span>
      </div>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;gap:8px">
      <div style="background:var(--error-bg);color:var(--error-fg);padding:14px 16px;border-radius:var(--radius-xl);text-align:center;font-weight:600">Not quite</div>
      <div style="display:flex;gap:8px;font-family:var(--font-mono);font-size:11px;color:var(--fg-subtle)">
        <span>bg <span class="hex" data-token="--error-bg"></span></span>
        <span>fg <span class="hex" data-token="--error-fg"></span></span>
      </div>
    </div>
  </div>
</div>
<script src="_hex.js"></script>
</body></html>
