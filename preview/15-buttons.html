<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div class="label">Buttons — three variants, two sizes. All ≥ 44px.</div>
  <div class="row" style="align-items:center">
    <button class="btn" style="height:48px;padding:0 20px;border-radius:12px;background:var(--action);color:var(--action-fg);border:none;font:500 16px var(--font-sans);cursor:pointer">Check answer</button>
    <button class="btn" style="height:48px;padding:0 20px;border-radius:12px;background:var(--action-2-bg);color:var(--action-2-fg);border:1px solid var(--action-2-border);font:500 16px var(--font-sans);cursor:pointer">Show answer</button>
    <button class="btn" style="height:44px;padding:0 16px;border-radius:8px;background:transparent;color:var(--fg-muted);border:none;font:500 14px var(--font-sans);cursor:pointer">Sign out</button>
    <button class="btn" style="height:48px;padding:0 20px;border-radius:12px;background:var(--action);color:var(--action-fg);border:none;font:500 16px var(--font-sans);opacity:0.4;cursor:not-allowed">Disabled</button>
  </div>
  <div style="display:flex;gap:24px;font-size:11px;color:var(--fg-subtle);font-family:var(--font-mono)">
    <span>primary · md</span><span>secondary · md</span><span>ghost · sm</span><span>disabled</span>
  </div>
</div>
</body></html>
