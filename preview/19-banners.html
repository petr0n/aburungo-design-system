<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div class="label">Result banners — only place green / red appears</div>
  <div class="row" style="align-items:stretch">
    <div style="flex:1;background:var(--success-bg);color:var(--success-fg);padding:16px;border-radius:16px;text-align:center">
      <div style="font-size:18px;font-weight:600">Recalled!</div>
    </div>
    <div style="flex:1;background:var(--error-bg);color:var(--error-fg);padding:16px;border-radius:16px;text-align:center">
      <div style="font-size:18px;font-weight:600">Not quite</div>
      <div lang="ja" style="font-family:var(--font-jp);font-size:14px;color:var(--error-500);margin-top:4px">You answered: えきがどこですか</div>
    </div>
  </div>
</div>
</body></html>
