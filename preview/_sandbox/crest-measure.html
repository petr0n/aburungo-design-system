<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Crest ground measurement — bare stages</title>
<!-- Deliberately unlabelled. Every crest x ground x tile size x opacity, with
     no text in the cells, so a script can read the darkest composited pixel
     out of a screenshot without a glyph skewing it. This is the surface the
     patterned-ground stand-in in scripts/check-contrast.mjs is measured from;
     re-run it whenever a crest is added. crest-3-4-5.html is the one to LOOK
     at. -->
<link rel="stylesheet" href="../../dist/tokens.plain.css">
<link rel="stylesheet" href="../../src/brand.css">
<style>
  body{margin:0;background:#fff;padding:0}
  .s{width:120px;height:120px;display:inline-block;margin:0}
  .page{background:var(--color-bg)}
  .card{background:var(--color-surface)}
  .well{background:var(--color-surface-2)}
  #grid{font-size:0}
</style>
</head>
<body>
<div id="grid"></div>
<script>
const OPS = [0.35,0.30,0.25,0.20,0.16,0.14,0.12]
const TILES = ['tile-sm','tile-md','tile-lg']
const cells = []
for (const crest of [1,2,3,4,5])
  for (const g of ['page','card','well'])
    for (const t of TILES)
      for (const o of OPS)
        cells.push(`<div class="s ${g} emboss-bg crest-${crest} ${t}" data-k="${crest}|${g}|${t}|${o}" style="--emboss-opacity:${o}"></div>`)
document.getElementById('grid').innerHTML = cells.join('')
</script>
</body>
</html>
